name: ACEest CI

on:
  push:
  pull_request:

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile check (syntax errors)
        run: python -m compileall -q .
      - name: Lint with flake8
        run: flake8 .

  docker-test:
    name: Docker image & Pytest
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --target runtime -t aceest-fitness:${{ github.sha }} .
      - name: Build test image
        run: docker build --target test -t aceest-fitness:test .
      - name: Run Pytest inside the container
        run: docker run --rm aceest-fitness:test
      - name: Smoke-test the runtime image
        run: |
          docker run -d --name aceest -p 5000:5000 aceest-fitness:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fs http://localhost:5000/health && exit 0
            sleep 1
          done
          docker logs aceest
          exit 1
