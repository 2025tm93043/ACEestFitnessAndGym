# Local SonarQube (Community) + PostgreSQL for the ACEest CI pipeline.
#   sudo sysctl -w vm.max_map_count=262144      # required by SonarQube's Elasticsearch (see RUNBOOK)
#   docker compose -f infra/sonarqube/docker-compose.yml up -d
# UI: http://<host>:9000   first login admin / admin (you are asked to change it)
services:
  db:
    image: postgres:16-alpine
    container_name: sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonar_db:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_VALIDATEWEBHOOKS: "false"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs

volumes:
  sonar_db:
  sonar_data:
  sonar_extensions:
  sonar_logs:
