# A/B router: header/cookie override or sticky 50/50 split. Endpoint :30085
apiVersion: v1
kind: ConfigMap
metadata:
  name: aceest-ab-router-conf
  namespace: aceest
data:
  default.conf: |
    upstream ab_a { server aceest-a:80; }
    upstream ab_b { server aceest-b:80; }

    # Sticky 50/50 split by client (IP + browser). Same client => same variant.
    split_clients "${remote_addr}${http_user_agent}" $auto_variant {
        50%  ab_b;
        *    ab_a;
    }

    # Manual override for testers:  curl -H "X-Variant: B" ...   or cookie  variant=B
    map $http_x_variant $header_variant {
        default "";
        "A"     ab_a;
        "B"     ab_b;
    }
    map $cookie_variant $cookie_choice {
        default "";
        "A"     ab_a;
        "B"     ab_b;
    }
    map $header_variant$cookie_choice $backend {
        default            $auto_variant;
        "~^(ab_[ab])"      $1;
    }

    server {
        listen 80;

        location = /router-health { return 200 "ok\n"; }

        location / {
            proxy_pass http://$backend;
            proxy_set_header Host $host;
            add_header X-Variant $backend always;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-ab-router
  namespace: aceest
  labels:
    app: aceest-ab-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-ab-router
  template:
    metadata:
      labels:
        app: aceest-ab-router
      annotations:
        # changing the ConfigMap does not restart nginx; bump this or run kubectl rollout restart
        config-version: "1"
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: {path: /router-health, port: 80}
            periodSeconds: 3
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: aceest-ab-router-conf
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-router
  namespace: aceest
spec:
  type: NodePort
  selector:
    app: aceest-ab-router
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30085
