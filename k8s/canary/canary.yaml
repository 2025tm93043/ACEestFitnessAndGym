# CANARY track: 1 replica of V_NEW => about 20% of requests (1 of 5 pods)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  namespace: aceest
  labels:
    app: aceest-canary
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-canary
      track: canary
  template:
    metadata:
      labels:
        app: aceest-canary
        track: canary
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: aceest
          image: ${DOCKERHUB_USER}/aceest-fitness:${V_NEW}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: ACEEST_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: aceest-secrets, key: secret-key}
            - name: ACEEST_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: aceest-secrets, key: admin-password}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
