# Selects BOTH tracks (only app label) so traffic is shared by replica ratio. Endpoint :30083
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary
  namespace: aceest
spec:
  type: NodePort
  selector:
    app: aceest-canary
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30083
