# ROLLING UPDATE - starts on V_OLD; update with: kubectl set image (see docs/RUNBOOK.md)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-rolling
  namespace: aceest
  labels:
    app: aceest-rolling
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # one extra pod during the update
      maxUnavailable: 0    # never drop below the desired replica count => zero downtime
  selector:
    matchLabels:
      app: aceest-rolling
  template:
    metadata:
      labels:
        app: aceest-rolling
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: aceest
          image: ${DOCKERHUB_USER}/aceest-fitness:${V_OLD}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: ACEEST_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: aceest-secrets, key: secret-key}
            - name: ACEEST_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: aceest-secrets, key: admin-password}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
