# SHADOW version: receives a copy of live traffic, its responses are discarded
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
  namespace: aceest
  labels:
    app: aceest-shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow
  template:
    metadata:
      labels:
        app: aceest-shadow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: aceest
          image: ${DOCKERHUB_USER}/aceest-fitness:${V_NEW}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: ACEEST_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: aceest-secrets, key: secret-key}
            - name: ACEEST_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: aceest-secrets, key: admin-password}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow
  namespace: aceest
spec:
  type: ClusterIP
  selector:
    app: aceest-shadow
  ports:
    - port: 80
      targetPort: 5000
