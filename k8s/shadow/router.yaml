# SHADOW router: nginx mirrors traffic to the shadow version. Endpoint :30084
apiVersion: v1
kind: ConfigMap
metadata:
  name: aceest-shadow-router-conf
  namespace: aceest
data:
  default.conf: |
    upstream live   { server aceest-live:80; }
    upstream shadow { server aceest-shadow:80; }

    server {
        listen 80;

        location = /router-health { return 200 "ok\n"; }

        location / {
            mirror /_mirror;                 # copy every request to the shadow version
            mirror_request_body on;
            proxy_pass http://live;          # the user only ever sees the live response
            proxy_set_header Host $host;
            add_header X-Served-By live always;
        }

        location = /_mirror {
            internal;
            proxy_pass http://shadow$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Shadow-Traffic "true";
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-router
  namespace: aceest
  labels:
    app: aceest-shadow-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow-router
  template:
    metadata:
      labels:
        app: aceest-shadow-router
      annotations:
        # changing the ConfigMap does not restart nginx; bump this or run kubectl rollout restart
        config-version: "1"
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: {path: /router-health, port: 80}
            periodSeconds: 3
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: aceest-shadow-router-conf
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-router
  namespace: aceest
spec:
  type: NodePort
  selector:
    app: aceest-shadow-router
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30084
