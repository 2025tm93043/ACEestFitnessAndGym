# SonarQube analysis configuration for ACEest Fitness & Gym
sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness & Gym
sonar.sourceEncoding=UTF-8

# application code at the repo root, tests are analysed separately
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,k8s/**,infra/**,docs/**,.venv/**,**/__pycache__/**
sonar.python.version=3.12

# produced by:  pytest --cov=. --cov-report=xml:coverage.xml --junitxml=test-results/junit.xml
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results/junit.xml
